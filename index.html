<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masjid Timings Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400&display=swap">
<style>
:root{--green:#0f5132;--green2:#17663f;--tint:#eef5f0;--ink:#1c2a22;--mute:#5d6d63;--line:#d9e3dc;--bg:#fbfcfa;--card:#fff;--gold:#b8892b}
@media (prefers-color-scheme:dark){:root{--ink:#e8efe9;--mute:#9db0a3;--line:#2b3a31;--bg:#101813;--card:#17221b;--tint:#1d2b22;--green:#4fb583;--green2:#3d9c6e}}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
header{background:#0f5132;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
header button{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:18px;margin:20px 0 8px}
p.sub{color:var(--mute);margin:0 0 16px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.red{background:#b3261e}.btn.full{width:100%}.btn.sm{padding:7px 12px;font-size:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
.card b{font-size:17px}.card small{color:var(--mute);display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:11px 12px;text-align:left;border-top:1px solid var(--line)}
th{background:var(--tint);font-size:13px;color:var(--mute);border-top:0}
td.t{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.grid{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center}
.msg{padding:10px 12px;border-radius:10px;margin:12px 0;background:var(--tint)}.msg.err{background:#fdeceb;color:#8c1d18}
.top{color:var(--green);text-decoration:none;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:30px 0}
</style>
</head>
<body>
<header><a href="#/">&#128332; Masjid Timings</a><button id="authBtn" onclick="location.hash='#/login'">Staff login</button></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vypgjmghvsygexdlrdui.supabase.co";
const SUPABASE_KEY = "sb_publishable_zhUgUmnOvStNyEX3iq5rVA_m8bY9dXs";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PR = [["fajr","Fajr"],["zuhr","Zuhr"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"]];
const $ = (id) => document.getElementById(id);
const app = $("app");
let session = null, role = null, myMasjid = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function t12(t){ if(!t) return "-"; const [h,m]=t.split(":").map(Number); return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM"); }
function note(text, err){ return text ? `<div class="msg ${err?"err":""}">${esc(text)}</div>` : ""; }

async function loadRole(){
  const { data } = await db.auth.getSession();
  session = data.session; role = null; myMasjid = null;
  if (session){
    const a = await db.from("admins").select("email").maybeSingle();
    if (a.data) role = "admin";
    else { const s = await db.from("staff").select("masjid_id").maybeSingle(); if (s.data){ role="staff"; myMasjid=s.data.masjid_id; } }
  }
  const b = $("authBtn");
  b.textContent = session ? "My panel" : "Staff login";
  b.onclick = () => location.hash = session ? "#/panel" : "#/login";
}

async function route(){
  const h = location.hash.replace(/^#\/?/, "").split("/");
  try{
    if (h[0]==="login") return viewLogin();
    if (h[0]==="panel") return viewPanel();
    if (h[0]==="edit") return viewEdit(h[1]);
    if (h[0]==="masjid" && h[1]) return viewMasjid(h[1]);
    return viewHome();
  }catch(e){ app.innerHTML = note("Something went wrong: "+e.message, true); }
}

/* ---------- Public ---------- */
async function viewHome(){
  app.innerHTML = `<h1>Find masjid timings</h1><p class="sub">Azan and Jamaat times near you.</p>
    <input id="q" placeholder="Search masjid name or area..." autocomplete="off"><div id="list"><p class="empty">Loading...</p></div>`;
  const { data, error } = await db.from("masjids").select("id,name,name_urdu,area").order("name");
  if (error) return $("list").innerHTML = note(error.message, true);
  const draw = () => {
    const q = $("q").value.trim().toLowerCase();
    const rows = data.filter(m => (m.name+" "+m.area).toLowerCase().includes(q));
    $("list").innerHTML = rows.length ? rows.map(m => `<a class="card" href="#/masjid/${m.id}"><b>${esc(m.name)}</b> <span class="ur">${esc(m.name_urdu)}</span><small>${esc(m.area)}</small></a>`).join("") : `<p class="empty">No masjid found.</p>`;
  };
  $("q").oninput = draw; draw();
}

async function viewMasjid(id){
  const { data:m, error } = await db.from("masjids").select("*").eq("id", id).maybeSingle();
  if (error || !m) return app.innerHTML = `<a class="top" href="#/">&lsaquo; Back</a>`+note("Masjid not found.", true);
  const map = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(m.name+" "+(m.address||m.area)+" "+m.city);
  app.innerHTML = `<a class="top" href="#/">&lsaquo; All masjids</a>
    <h1>${esc(m.name)}</h1><div class="ur" style="font-size:20px">${esc(m.name_urdu)}</div>
    <p class="sub">${esc(m.address||m.area)}${m.phone?" &bull; "+esc(m.phone):""}</p>
    <a class="btn full" href="${map}" target="_blank" rel="noopener">Get directions</a>
    <h2>Namaz timings</h2>
    <table><tr><th>Prayer</th><th>Azan</th><th>Jamaat</th></tr>
    ${PR.map(([k,n]) => `<tr><td>${n}</td><td class="t">${t12(m.timings?.[k]?.azan)}</td><td class="t">${t12(m.timings?.[k]?.jamaat)}</td></tr>`).join("")}</table>
    ${(m.khutbah1||m.khutbah2) ? `<h2>Friday Jumu'ah</h2><table><tr><td>Khutbah 1</td><td class="t">${t12(m.khutbah1)}</td></tr><tr><td>Khutbah 2</td><td class="t">${t12(m.khutbah2)}</td></tr></table>` : ""}`;
}

/* ---------- Login ---------- */
function viewLogin(msg){
  if (session) return location.hash = "#/panel";
  app.innerHTML = `<h1>Staff login</h1><p class="sub">For masjid staff and the super admin.</p>${note(msg,true)}
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <p><button class="btn full" id="go">Log in</button></p>`;
  $("go").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
    if (error) return viewLogin("Wrong email or password.");
    await loadRole(); location.hash = "#/panel"; route();
  };
}

/* ---------- Panel ---------- */
async function viewPanel(){
  if (!session) return location.hash = "#/login";
  if (role === "staff") return viewEdit(myMasjid);
  if (role !== "admin") return app.innerHTML = `<h1>My panel</h1>${note("Your account is not linked to a masjid yet. Please contact the admin.", true)}<button class="btn alt" onclick="logout()">Log out</button>`;
  const [m, s] = await Promise.all([db.from("masjids").select("id,name,area").order("name"), db.from("staff").select("email,masjid_id").order("email")]);
  const masjids = m.data || [], staff = s.data || [];
  const nameOf = (id) => (masjids.find(x => x.id===id)||{}).name || "-";
  app.innerHTML = `<h1>Admin panel</h1>
    <div class="row"><a class="btn" href="#/edit/new">+ Add masjid</a><button class="btn alt" onclick="logout()">Log out</button></div>
    <h2>Masjids (${masjids.length})</h2>
    ${masjids.map(x => `<div class="card"><b>${esc(x.name)}</b><small>${esc(x.area)}</small>
      <div class="row" style="margin-top:8px"><a class="btn sm alt" href="#/edit/${x.id}">Edit</a><button class="btn sm red" data-del="${x.id}">Delete</button></div></div>`).join("") || `<p class="empty">No masjids yet.</p>`}
    <h2>Staff</h2>
    ${staff.map(x => `<div class="card"><b>${esc(x.email)}</b><small>${esc(nameOf(x.masjid_id))}</small>
      <div style="margin-top:8px"><button class="btn sm red" data-rm="${esc(x.email)}">Remove</button></div></div>`).join("") || `<p class="empty">No staff added yet.</p>`}
    <div class="card"><b>Add staff</b>
      <label>Staff email (must have a login)</label><input id="se" type="email">
      <label>Masjid</label><select id="sm">${masjids.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
      <p><button class="btn full" id="addStaff">Add staff</button></p><div id="sm-msg"></div></div>`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this masjid and its timings?")) return;
    const r = await db.from("masjids").delete().eq("id", b.dataset.del); if (r.error) alert(r.error.message); viewPanel();
  });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this staff member?")) return;
    const r = await db.from("staff").delete().eq("email", b.dataset.rm); if (r.error) alert(r.error.message); viewPanel();
  });
  $("addStaff").onclick = async () => {
    const email = $("se").value.trim().toLowerCase(); if (!email || !$("sm").value) return;
    const r = await db.from("staff").upsert({ email, masjid_id: $("sm").value });
    if (r.error) $("sm-msg").innerHTML = note(r.error.message, true); else viewPanel();
  };
}

async function viewEdit(id){
  if (!session) return location.hash = "#/login";
  const isNew = id === "new";
  if (isNew && role !== "admin") return location.hash = "#/panel";
  let m = { name:"", name_urdu:"", area:"", address:"", city:"Hyderabad", phone:"", khutbah1:"", khutbah2:"", timings:{} };
  if (!isNew){ const r = await db.from("masjids").select("*").eq("id", id).maybeSingle(); if (!r.data) return app.innerHTML = note("Masjid not found.", true); m = r.data; }
  const adm = role === "admin";
  const back = adm ? `<a class="top" href="#/panel">&lsaquo; Admin panel</a>` : `<button class="btn alt sm" onclick="logout()">Log out</button>`;
  app.innerHTML = `${back}<h1>${isNew ? "Add masjid" : esc(m.name)}</h1>
    ${adm ? `<label>Masjid name</label><input id="f_name" value="${esc(m.name)}">
    <label>Name in Urdu (optional)</label><input id="f_urdu" class="ur" value="${esc(m.name_urdu)}">
    <label>Area (for search)</label><input id="f_area" value="${esc(m.area)}">
    <label>Full address</label><input id="f_addr" value="${esc(m.address)}">
    <label>Phone (optional)</label><input id="f_phone" value="${esc(m.phone)}">` : ""}
    <h2>Namaz timings</h2>
    <div class="grid"><span></span><b>Azan</b><b>Jamaat</b>
    ${PR.map(([k,n]) => `<span>${n}</span><input type="time" id="a_${k}" value="${m.timings?.[k]?.azan||""}"><input type="time" id="j_${k}" value="${m.timings?.[k]?.jamaat||""}">`).join("")}</div>
    <h2>Friday Jumu'ah</h2>
    <div class="grid"><span>Khutbah 1</span><input type="time" id="k1" value="${m.khutbah1||""}"><span></span><span>Khutbah 2</span><input type="time" id="k2" value="${m.khutbah2||""}"><span></span></div>
    <p><button class="btn full" id="save">Save</button></p><div id="out"></div>`;
  $("save").onclick = async () => {
    const timings = {}; PR.forEach(([k]) => timings[k] = { azan: $("a_"+k).value, jamaat: $("j_"+k).value });
    const row = { timings, khutbah1: $("k1").value || null, khutbah2: $("k2").value || null };
    if (adm){
      if (!$("f_name").value.trim() || !$("f_area").value.trim()) return $("out").innerHTML = note("Please enter the masjid name and area.", true);
      Object.assign(row, { name: $("f_name").value.trim(), name_urdu: $("f_urdu").value.trim() || null, area: $("f_area").value.trim(), address: $("f_addr").value.trim() || null, phone: $("f_phone").value.trim() || null });
    }
    const r = isNew ? await db.from("masjids").insert(row) : await db.from("masjids").update(row).eq("id", id).select();
    if (r.error) return $("out").innerHTML = note(r.error.message, true);
    if (!isNew && (!r.data || !r.data.length)) return $("out").innerHTML = note("Could not save. You may not have permission.", true);
    if (adm) location.hash = "#/panel"; else $("out").innerHTML = note("Saved. The public page is updated.");
  };
}

async function logout(){ await db.auth.signOut(); await loadRole(); location.hash = "#/"; route(); }

window.addEventListener("hashchange", route);
loadRole().then(route);
</script>
</body>
</html>
